name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - name: Install Linux credential service
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y gnome-keyring dbus-x11
    - name: Test with an isolated Linux keyring
      if: runner.os == 'Linux'
      run: |
        dbus-run-session -- bash -euc '
          printf "%s" "envghost-ci-only" | gnome-keyring-daemon --unlock --components=secrets
          cargo test --locked
        '
    - name: Test Windows credential storage
      if: runner.os == 'Windows'
      run: cargo test --locked
