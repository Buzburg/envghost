[package]
name = "envghost"
version = "0.1.1"
edition = "2021"
authors = ["Buzburg AI <dev@buzburg.ai>"]
description = "Credential masking, OS-backed storage, and child-process output redaction."
license = "MIT"
repository = "https://github.com/Buzburg/envghost"
keywords = ["security", "secrets", "ai-agents", "honeytoken", "sandbox"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.11"
colored = "2.1"
sha2 = "0.10"
keyring = "4.2"

[dev-dependencies]
tempfile = "3.17"
