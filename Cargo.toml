[package]
name = "envghost"
version = "0.1.0"
edition = "2021"
authors = ["Buzburg AI <dev@buzburg.ai>"]
description = "Zero-knowledge honey-credential virtualizer and secret enclave for AI coding agents."
license = "MIT OR Apache-2.0"
repository = "https://github.com/buzburgai-arch/envghost"
keywords = ["security", "secrets", "ai-agents", "honeytoken", "sandbox"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.11"
colored = "2.1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.17"
